  entities-card-row-gap: "3px"
  ha-card-border-color: "rgba(255, 240, 225, 0.20)"
  ha-card-border-width: "1px"
  ha-card-border-radius: "10px"
  ha-card-box-shadow: "none"
  divider-color: "rgba(255, 240, 225, 0.18)"
  app-header-background-color: "transparent"
  app-header-text-color: "#fbf3ea"
  sidebar-background-color: "rgba(40, 30, 42, 0.55)"
  sidebar-text-color: "#fbf3ea"
  sidebar-icon-color: "#d3bfae"
  sidebar-selected-icon-color: "#f0b775"
  sidebar-selected-text-color: "#f0b775"
  state-icon-color: "#d3bfae"
