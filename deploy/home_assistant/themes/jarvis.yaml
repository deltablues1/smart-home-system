  wa-color-text-quiet: "var(--secondary-text-color)"
  wa-color-neutral-fill-normal: "var(--secondary-background-color)"
  ha-color-fill-primary-quiet-resting: "color-mix(in srgb, var(--primary-color) 15%, var(--card-background-color))"
