  wa-color-text-normal: "var(--primary-text-color)"
  wa-color-text-quiet: "var(--secondary-text-color)"
  wa-color-neutral-fill-normal: "var(--secondary-background-color)"
  ha-color-fill-primary-quiet-resting: "color-mix(in srgb, var(--primary-color) 15%, var(--card-background-color))"
  ha-color-fill-primary-quiet-hover: "color-mix(in srgb, var(--primary-color) 25%, var(--card-background-color))"
  entities-card-row-gap: "3px"
  ha-card-border-color: "rgba(255, 255, 255, 0.10)"
  ha-card-border-width: "1px"
  ha-card-border-radius: "10px"
  ha-card-box-shadow: "none"
  divider-color: "rgba(255, 255, 255, 0.09)"
  app-header-background-color: "transparent"
  app-header-text-color: "#e7e5e1"
  sidebar-background-color: "rgba(10, 14, 23, 0.72)"
  sidebar-text-color: "#e7e5e1"
  sidebar-icon-color: "#8b8d94"
  sidebar-selected-icon-color: "#e8a33d"
  sidebar-selected-text-color: "#e8a33d"
  state-icon-color: "#8b8d94"
  state-icon-active-color: "#e8a33d"
  paper-item-icon-color: "#8b8d94"
  paper-item-icon-active-color: "#e8a33d"
