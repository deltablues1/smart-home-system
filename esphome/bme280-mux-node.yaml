# Dijagnostika SPS30. ESPHome driver cita samo "data ready" (0x0202), a senzor
# ima i registar stanja (0xD206) s bitovima za kvar ventilatora, kvar lasera i
# brzinu ventilatora izvan raspona. Bez toga se pokvaren ventilator ne moze
# razlikovati od zaprljane optike, a to je razlika izmedu reklamacije i smeca.
# Ispisuje se svakih 5 minuta:  esphome logs ... | findstr sps30_status
interval:
  - interval: 300s
    then:
      - lambda: |-
          static const char *const TAG = "sps30_status";
          uint8_t cmd[2] = {0xD2, 0x06};
          if (id(sps30_air)->write(cmd, 2) != i2c::ERROR_OK) {
            ESP_LOGW(TAG, "ne mogu poslati upit za status");
            return;
          }
          delay(20);
          uint8_t buf[6];
          if (id(sps30_air)->read(buf, 6) != i2c::ERROR_OK) {
            ESP_LOGW(TAG, "ne mogu procitati registar stanja");
            return;
          }
          uint32_t st = ((uint32_t) buf[0] << 24) | ((uint32_t) buf[1] << 16) |
                        ((uint32_t) buf[3] << 8)  | (uint32_t) buf[4];
          ESP_LOGI(TAG,
                   "status=0x%08X  ventilator_kvar=%u  laser_kvar=%u  brzina_izvan_raspona=%u",
                   (unsigned) st, (unsigned) ((st >> 4) & 1), (unsigned) ((st >> 5) & 1),
                   (unsigned) ((st >> 21) & 1));

# Trigger the two RMS voltage calculations together every five seconds.

# IP i razlog zadnjeg reseta: razlikuju "pala je veza" od "plocica se resetirala".
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "BME280 Mux IP"
      entity_category: diagnostic
  - platform: debug
    reset_reason:
      name: "BME280 Mux razlog reseta"
      entity_category: diagnostic

debug:
  update_interval: 60s
