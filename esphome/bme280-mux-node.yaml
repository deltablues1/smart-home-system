      filters:
        # Odbaci reset-vrijednosti registara: kad citanje preko TCA9548A
        # kanala ne prodje, BME280 vrati svoje pocetne registre, sto se
        # kompenzira u dvije fiksne besmislice po senzoru (izmjereno
        # 2026-08-20: kupaona 188.5 / -57.6, soba 187.4 / -59.4). Vlaga i tlak
        # imaju iste takve vrijednosti: vlaga tocno 0.0 i 100.0 %, tlak oko
        # 496-519 hPa i 1240-1253 hPa (izmjereno 22.08. nakon prvog flasha).
        - lambda: |-
            if (x < 850 || x > 1085) {
              ESP_LOGW("bme280_range", "Soba tlak: odbaceno %.2f", x);
              return {};
            }
            return x;
    iir_filter: 4x

