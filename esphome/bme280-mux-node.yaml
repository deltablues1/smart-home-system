substitutions:
  node_name: bme280-mux-node
  friendly_name: BME280 Mux Node
  # Most GY-BME280 boards are 0x76 or 0x77.
  # If ESPHome logs show only 0x77 behind the TCA channels, change this to 0x77.
  bme280_address: "0x76"
  # Set after comparing "ZMPT RMS sirovo" with a trusted multimeter.
  # 233 V / 0.096 V RMS measured at ADS #2 A0 (after the 22k/22k divider).
  voltage_calibration: "2427.1"
  # Temporary PF used for an estimated W value. Resistive loads are close to 1.00.
  assumed_power_factor: "1.00"

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}

external_components:
  - source:
      type: local
      path: components
    components: [phase_power]

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key_mux

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  # Fiksna adresa: HA-ova ESPHome veza pamti IP, pa mu promjena adrese
  # (nakon nestanka struje i novog DHCP kruga) obori sve entitete.
  manual_ip:
    static_ip: 192.168.100.102
    gateway: 192.168.100.1
    subnet: 255.255.255.0
    dns1: 192.168.100.1
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret wifi_ap_password

captive_portal:

web_server:
  port: 80
  auth:
    username: !secret web_server_username
    password: !secret web_server_password

# total_daily_energy needs to know when local midnight is. Time comes from Home
# Assistant over the existing API connection rather than SNTP: no internet
# dependency, and nothing new to reach on the network. If HA goes away the ESP32
# keeps its own clock running, so counting continues through an outage -- only a
# power cut while HA is also down would leave it without a reference.
time:
  - platform: homeassistant
    id: node_time

# Two separate I2C peripherals so the two loads never compete.
i2c:
  # Bus A: the two ADS1115 only. Short traces on the board, so it can run fast.
  # This is what sets the sampling rate of the power measurement.
  - id: i2c_power
    sda: GPIO21
    scl: GPIO22
    scan: true
    frequency: 400kHz

  # Bus B: TCA9548A -> BME280 x5 and SPS30. Slow on purpose: SPS30 is specified
  # for 100 kHz max, and the sensor runs are long (5-10 m). Nothing here needs
  # speed - the fastest update interval is 30 s.
  # 10 kHz, confirmed by measurement on 2026-08-15. At 50 kHz the SPS30 failed
  # with ERROR_NOT_ACKNOWLEDGED while the BME280s on the same bus were fine:
  # the GY-BME280 modules carry their own 10k pull-ups at the far cable end,
  # the SPS30 is a bare sensor with none, so it is the first device to lose the
  # rise-time budget on a long run. Dropping to 10 kHz brought it straight back
  # (serial 8F66E4A835E65C40, fw v2.2).
  #
  # Kept at 10 kHz on purpose: nothing on this bus needs speed (BME280 every
  # 60 s, SPS30 every 30 s) and the long sensor runs want all the margin they
  # can get. Still fit 2.2k pull-ups on GPIO18/19 - at 10 kHz the ~4 us rise is
  # only 4 % of a bit so it works, but there is no headroom for extra cable.
  - id: i2c_sensors
    sda: GPIO18
    scl: GPIO19
    scan: true
    frequency: 10kHz

# TCA9548A I2C multiplexer.
# BME280 sensors can all use the same I2C address because each one is on a separate channel.
tca9548a:
  - id: tca_bme280
    address: 0x70
    i2c_id: i2c_sensors
    channels:
      - bus_id: tca_ch0_vanjska
        channel: 0
      - bus_id: tca_ch1_ulaz
        channel: 1
      - bus_id: tca_ch2_dnevni
        channel: 2
      - bus_id: tca_ch3_kupaona
        channel: 3
      - bus_id: tca_ch4_soba
        channel: 4
      # SPS30 air-quality sensor on mux channel 5.
      - bus_id: tca_ch5_sps30
        channel: 5

# First ADS1115 on the main I2C bus (ADDR -> GND = 0x48).
# A0 = SCT-013 signal, A1 = VBIAS (~1.65 V), measured differentially.
# Second ADS1115 (ADDR -> 3.3 V = 0x49) carries the ZMPT101B mains voltage.
#
# Which clamp is where (verified 2026-09-12 against live readings):
#   channel 1, A0-A3 . "Kat"         - the upstairs sub-feed
#   channel 2, A2-A3 . "Kuca ukupno" - the incomer, so it reads the whole house
# Ground floor is not measured: it is the difference of the two, published
# below as a template sensor. Only REAL power subtracts honestly - see there.
phase_power:
  id: phase_power_test
  i2c_id: i2c_power
  current_address: 0x48
  voltage_address: 0x49
  voltage_calibration: ${voltage_calibration}
  # SCT-013-000 is 100 A : 50 mA (2000:1), so A-per-volt = 2000 / burden.
  # 47 ohm burden -> 42.553 A/V, full scale ~49.7 A against the 3.3 V rail.
  # Both channels must use the same burden value so one phase correction fits.
  # 42.553 is this channel's nominal value; 41.70 = 42.553 x 0.980. The same
  # 1800 W kettle run upstairs on 2026-09-13 moved the house 1772 W and this
  # channel 1809 W (0.980; the induction hob gave 0.978, twenty morning steps
  # 0.981), so upstairs read 2 % high against the incomer and the ground floor
  # went negative under every big upstairs load. This matches the channel to
  # the house; the absolute scale is settled on the house against the meter.
  current_calibration: 41.70
  # ADS #1 (SCT) ALERT/RDY -> GPIO33; ADS #2 (ZMPT) ALERT/RDY -> GPIO32.
  # ESP32 internal pull-ups are enabled by the pin modes below.
  current_rdy_pin:
    number: GPIO33
    mode:
      input: true
      pullup: true
  voltage_rdy_pin:
    number: GPIO32
    mode:
      input: true
      pullup: true
  # Baseline run: retain the original SCT polarity while we capture a sync log.
  # SCT polarity was verified with a resistive kettle: invert so import is +W.
  invert_current: true
  minimum_current: 0.05
  # Voltage is taken this much earlier than the current sample it is paired
  # with. A resistive load must add no reactive power: at -1280 the 56 boiler
  # and kettle steps of 2026-09-13 still read as a 7.4 deg lag (upstairs 7.0)
  # and the house under-read the utility meter by 6 %. 7.4 deg at 50 Hz is
  # 411 us more. Check after flashing: step angle ~0, meter within ~1 %.
  voltage_lag_correction_us: -1690
  samples_per_result: 800
  rms_voltage:
    name: "Mrezni napon"
    accuracy_decimals: 1
  rms_current:
    name: "Kat struja"
    accuracy_decimals: 2
  real_power:
    name: "Kat stvarna snaga"
    id: p_kat
    accuracy_decimals: 1
    on_value:
      then:
        - lambda: id(kat_since_house) = x;
  apparent_power:
    name: "Kat prividna snaga"
    accuracy_decimals: 1
  power_factor:
    name: "Kat faktor snage"
    accuracy_decimals: 3
  # Second SCT-013-000 on the same ADS1115, mux A2-A3. The mux moves once per
  # completed batch, so this channel is sampled at the full 860 SPS but its
  # value refreshes every other batch (~2 s instead of ~1 s).
  # Use the SAME burden resistor value as channel 1 so both share one phase
  # correction.
  current_channel_2:
    # Both clamps were measured on the same conductor across six loads spanning
    # 0.128-7.53 A: channel 2 read 1.011x high with the ratio constant to
    # +/-0.3 % over that 59:1 range. Crosstalk was ruled out separately - with
    # either clamp removed both channels fall to zero. So this is a genuine
    # gain difference between the two clamps: 42.553 / 1.011.
    current_calibration: 42.09
    invert_current: true
    rms_current:
      name: "Kuca ukupno struja"
      accuracy_decimals: 2
    real_power:
      name: "Kuca ukupno stvarna snaga"
      id: p_ukupno
      accuracy_decimals: 1
      on_value:
        then:
          - lambda: |-
              // Pair the upstairs reading taken since the last house reading
              // with the mean of the house readings either side of it. A house
              // jump means something switched inside the window and the
              // upstairs reading may sit on either side of it: skip that pair.
              const float before = id(house_before_kat), upstairs = id(kat_since_house);
              if (!std::isnan(before) && !std::isnan(upstairs) && std::fabs(x - before) < 150.0f)
                id(p_prizemlje_raw).publish_state((before + x) / 2.0f - upstairs);
              id(house_before_kat) = x;
              id(kat_since_house) = NAN;
    apparent_power:
      name: "Kuca ukupno prividna snaga"
      accuracy_decimals: 1
    power_factor:
      name: "Kuca ukupno faktor snage"
      accuracy_decimals: 3

# Scratch values for pairing the two alternating power channels; see
# "Prizemlje stvarna snaga".
globals:
  - id: house_before_kat
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: kat_since_house
    type: float
    restore_value: no
    initial_value: 'NAN'

sensor:
  # Ground floor is not its own clamp: it is what the house draws minus what
  # the upstairs feed draws.
  #
  # REAL power (W) is the only quantity that may be subtracted like this. It is
  # additive because it is an average of v*i over the cycle, so the two feeds
  # sum regardless of their phase angles. RMS current and apparent power are
  # NOT additive - two 5 A loads at different power factors do not draw 10 A
  # from the incomer - so there is deliberately no "Prizemlje struja" here.
  #
  # The channels are read in turn (~1.3 s each), so the latest house and
  # upstairs readings are never from the same moment. Subtracting them straight
  # put the ground floor at -835 W whenever the pulsing induction hob switched
  # between the two (2026-09-13). Now each upstairs reading is paired with the
  # mean of the house readings either side of it (in p_ukupno's on_value),
  # pairs with a house jump in between are skipped, four pairs are averaged
  # (~10 s), and what is left is clamped at zero: a floor cannot draw negative
  # power. The persistent minus that pointed at a calibration error was fixed
  # at its source (current_calibration above). Ground-floor ENERGY does not
  # come from this sensor; it is house minus upstairs energy, below.
  - platform: template
    id: p_prizemlje_raw
    internal: true
    unit_of_measurement: "W"
    accuracy_decimals: 1
    update_interval: never

  - platform: copy
    source_id: p_prizemlje_raw
    name: "Prizemlje stvarna snaga"
    id: p_prizemlje
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - sliding_window_moving_average:
          window_size: 4
          send_every: 2
      - lambda: return std::max(x, 0.0f);

  # Energy counted on the node itself, not only in Home Assistant.
  #
  # The HA integration helpers stop counting whenever the node loses Wi-Fi or HA
  # restarts, and that gap is gone for good. total_daily_energy integrates on the
  # ESP32 and keeps the running total in flash (restore defaults to true), so a
  # dropped link costs nothing: HA reads the accumulated figure when it comes
  # back. It resets at local midnight, which is why it does not replace the HA
  # helpers -- those are the ones the meter comparison needs, because they never
  # reset. Together: the helpers give the long total, these survive an outage.
  - platform: total_daily_energy
    name: "Kuca ukupno dnevno"
    id: e_kuca_dnevno
    power_id: p_ukupno
    unit_of_measurement: kWh
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: total_daily_energy
    name: "Kat dnevno"
    id: e_kat_dnevno
    power_id: p_kat
    unit_of_measurement: kWh
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # House minus upstairs, not an integral of the ground-floor power: that way
  # upstairs + ground always add up to the house and the zero clamp above
  # cannot inflate it. The two counters update ~1 s apart, so the difference
  # can wobble by a fraction of a Wh; it is held at the day's highest value so
  # the counter never runs backwards, and released when the house counter
  # restarts at local midnight.
  - platform: template
    name: "Prizemlje dnevno"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: 30s
    lambda: |-
      const float house = id(e_kuca_dnevno).state, upstairs = id(e_kat_dnevno).state;
      if (std::isnan(house) || std::isnan(upstairs))
        return {};
      static float held = 0.0f, last_house = 0.0f;
      if (house < last_house)
        held = 0.0f;
      last_house = house;
      if (house - upstairs > held)
        held = house - upstairs;
      return held;

  # Differential voltage between SCT SIGNAL (A0) and VBIAS (A1).
  # RMS current from SCT-013-000 (100 A : 50 mA) with a 100 ohm burden.
  # 1 V RMS on the burden ~ 20 A, hence multiply: 20.
  # 400 ms sample window = 20 full 50 Hz mains periods.
  # ZMPT OUT -> 22k -> ADS A0, with another 22k from A0 to GND.
  # A1 is tied to GND. The RMS algorithm removes ZMPT's DC offset.
  # RMS voltage × RMS current. This is apparent power (VA), not real power (W).
  # Estimate only: W = Vrms × Irms × assumed PF. True W needs phase-synchronised samples.
  - platform: bme280_i2c
    id: bme280_vanjska
    i2c_id: tca_ch0_vanjska
    address: ${bme280_address}
    update_interval: 60s
    temperature:
      name: "Vanjska temperatura"
      oversampling: 16x
      filters:
        # Odbaci reset-vrijednosti registara: kad citanje preko TCA9548A
        # kanala ne prodje, BME280 vrati svoje pocetne registre, sto se
        # kompenzira u dvije fiksne besmislice po senzoru (izmjereno
        # 2026-08-20: kupaona 188.5 / -57.6, soba 187.4 / -59.4). Vlaga i tlak
        # imaju iste takve vrijednosti: vlaga tocno 0.0 i 100.0 %, tlak oko
        # 496-519 hPa i 1240-1253 hPa (izmjereno 22.08. nakon prvog flasha).
        - lambda: |-
            if (x < -40 || x > 85) {
              ESP_LOGW("bme280_range", "Vanjska temperatura: odbaceno %.2f", x);
              return {};
            }
            return x;
    humidity:
      name: "Vanjska vlaga"
      oversampling: 16x
      filters:
        # Odbaci reset-vrijednosti registara: kad citanje preko TCA9548A
        # kanala ne prodje, BME280 vrati svoje pocetne registre, sto se
        # kompenzira u dvije fiksne besmislice po senzoru (izmjereno
        # 2026-08-20: kupaona 188.5 / -57.6, soba 187.4 / -59.4). Vlaga i tlak
        # imaju iste takve vrijednosti: vlaga tocno 0.0 i 100.0 %, tlak oko
        # 496-519 hPa i 1240-1253 hPa (izmjereno 22.08. nakon prvog flasha).
        - lambda: |-
            if (x <= 0 || x >= 100) {
              ESP_LOGW("bme280_range", "Vanjska vlaga: odbaceno %.2f", x);
              return {};
            }
            return x;
    pressure:
      name: "Vanjski tlak"
      oversampling: 16x
      filters:
        # Odbaci reset-vrijednosti registara: kad citanje preko TCA9548A
        # kanala ne prodje, BME280 vrati svoje pocetne registre, sto se
        # kompenzira u dvije fiksne besmislice po senzoru (izmjereno
        # 2026-08-20: kupaona 188.5 / -57.6, soba 187.4 / -59.4). Vlaga i tlak
        # imaju iste takve vrijednosti: vlaga tocno 0.0 i 100.0 %, tlak oko
        # 496-519 hPa i 1240-1253 hPa (izmjereno 22.08. nakon prvog flasha).
        - lambda: |-
            if (x < 850 || x > 1085) {
              ESP_LOGW("bme280_range", "Vanjski tlak: odbaceno %.2f", x);
              return {};
            }
            return x;
    iir_filter: 4x

  - platform: bme280_i2c
    id: bme280_ulaz
    i2c_id: tca_ch1_ulaz
    address: ${bme280_address}
    update_interval: 60s
    temperature:
      name: "Ulaz temperatura"
      oversampling: 16x
      filters:
        # Odbaci reset-vrijednosti registara: kad citanje preko TCA9548A
        # kanala ne prodje, BME280 vrati svoje pocetne registre, sto se
        # kompenzira u dvije fiksne besmislice po senzoru (izmjereno
        # 2026-08-20: kupaona 188.5 / -57.6, soba 187.4 / -59.4). Vlaga i tlak
        # imaju iste takve vrijednosti: vlaga tocno 0.0 i 100.0 %, tlak oko
        # 496-519 hPa i 1240-1253 hPa (izmjereno 22.08. nakon prvog flasha).
        - lambda: |-
            if (x < -40 || x > 85) {
              ESP_LOGW("bme280_range", "Ulaz temperatura: odbaceno %.2f", x);
              return {};
            }
            return x;
    humidity:
      name: "Ulaz vlaga"
      oversampling: 16x
      filters:
        # Odbaci reset-vrijednosti registara: kad citanje preko TCA9548A
        # kanala ne prodje, BME280 vrati svoje pocetne registre, sto se
        # kompenzira u dvije fiksne besmislice po senzoru (izmjereno
        # 2026-08-20: kupaona 188.5 / -57.6, soba 187.4 / -59.4). Vlaga i tlak
        # imaju iste takve vrijednosti: vlaga tocno 0.0 i 100.0 %, tlak oko
        # 496-519 hPa i 1240-1253 hPa (izmjereno 22.08. nakon prvog flasha).
        - lambda: |-
            if (x <= 0 || x >= 100) {
              ESP_LOGW("bme280_range", "Ulaz vlaga: odbaceno %.2f", x);
              return {};
            }
            return x;
    pressure:
      name: "Ulaz tlak"
      oversampling: 16x
      filters:
        # Odbaci reset-vrijednosti registara: kad citanje preko TCA9548A
        # kanala ne prodje, BME280 vrati svoje pocetne registre, sto se
        # kompenzira u dvije fiksne besmislice po senzoru (izmjereno
        # 2026-08-20: kupaona 188.5 / -57.6, soba 187.4 / -59.4). Vlaga i tlak
        # imaju iste takve vrijednosti: vlaga tocno 0.0 i 100.0 %, tlak oko
        # 496-519 hPa i 1240-1253 hPa (izmjereno 22.08. nakon prvog flasha).
        - lambda: |-
            if (x < 850 || x > 1085) {
              ESP_LOGW("bme280_range", "Ulaz tlak: odbaceno %.2f", x);
              return {};
            }
            return x;
    iir_filter: 4x

  - platform: bme280_i2c
    id: bme280_dnevni
    i2c_id: tca_ch2_dnevni
    address: ${bme280_address}
    update_interval: 60s
    temperature:
      name: "Dnevni prostor temperatura"
      oversampling: 16x
      filters:
        # Odbaci reset-vrijednosti registara: kad citanje preko TCA9548A
        # kanala ne prodje, BME280 vrati svoje pocetne registre, sto se
        # kompenzira u dvije fiksne besmislice po senzoru (izmjereno
        # 2026-08-20: kupaona 188.5 / -57.6, soba 187.4 / -59.4). Vlaga i tlak
        # imaju iste takve vrijednosti: vlaga tocno 0.0 i 100.0 %, tlak oko
        # 496-519 hPa i 1240-1253 hPa (izmjereno 22.08. nakon prvog flasha).
        - lambda: |-
            if (x < -40 || x > 85) {
              ESP_LOGW("bme280_range", "Dnevni prostor temperatura: odbaceno %.2f", x);
              return {};
            }
            return x;
    humidity:
      name: "Dnevni prostor vlaga"
      oversampling: 16x
      filters:
        # Odbaci reset-vrijednosti registara: kad citanje preko TCA9548A
        # kanala ne prodje, BME280 vrati svoje pocetne registre, sto se
        # kompenzira u dvije fiksne besmislice po senzoru (izmjereno
        # 2026-08-20: kupaona 188.5 / -57.6, soba 187.4 / -59.4). Vlaga i tlak
        # imaju iste takve vrijednosti: vlaga tocno 0.0 i 100.0 %, tlak oko
        # 496-519 hPa i 1240-1253 hPa (izmjereno 22.08. nakon prvog flasha).
        - lambda: |-
            if (x <= 0 || x >= 100) {
              ESP_LOGW("bme280_range", "Dnevni prostor vlaga: odbaceno %.2f", x);
              return {};
            }
            return x;
    pressure:
      name: "Dnevni prostor tlak"
      oversampling: 16x
      filters:
        # Odbaci reset-vrijednosti registara: kad citanje preko TCA9548A
        # kanala ne prodje, BME280 vrati svoje pocetne registre, sto se
        # kompenzira u dvije fiksne besmislice po senzoru (izmjereno
        # 2026-08-20: kupaona 188.5 / -57.6, soba 187.4 / -59.4). Vlaga i tlak
        # imaju iste takve vrijednosti: vlaga tocno 0.0 i 100.0 %, tlak oko
        # 496-519 hPa i 1240-1253 hPa (izmjereno 22.08. nakon prvog flasha).
        - lambda: |-
            if (x < 850 || x > 1085) {
              ESP_LOGW("bme280_range", "Dnevni prostor tlak: odbaceno %.2f", x);
              return {};
            }
            return x;
    iir_filter: 4x

  - platform: bme280_i2c
    id: bme280_kupaona
    i2c_id: tca_ch3_kupaona
    address: ${bme280_address}
    update_interval: 60s
    temperature:
      name: "Kupaona temperatura"
      oversampling: 16x
      filters:
        # Odbaci reset-vrijednosti registara: kad citanje preko TCA9548A
        # kanala ne prodje, BME280 vrati svoje pocetne registre, sto se
        # kompenzira u dvije fiksne besmislice po senzoru (izmjereno
        # 2026-08-20: kupaona 188.5 / -57.6, soba 187.4 / -59.4). Vlaga i tlak
        # imaju iste takve vrijednosti: vlaga tocno 0.0 i 100.0 %, tlak oko
        # 496-519 hPa i 1240-1253 hPa (izmjereno 22.08. nakon prvog flasha).
        - lambda: |-
            if (x < -40 || x > 85) {
              ESP_LOGW("bme280_range", "Kupaona temperatura: odbaceno %.2f", x);
              return {};
            }
            return x;
    humidity:
      name: "Kupaona vlaga"
      oversampling: 16x
      filters:
        # Odbaci reset-vrijednosti registara: kad citanje preko TCA9548A
        # kanala ne prodje, BME280 vrati svoje pocetne registre, sto se
        # kompenzira u dvije fiksne besmislice po senzoru (izmjereno
        # 2026-08-20: kupaona 188.5 / -57.6, soba 187.4 / -59.4). Vlaga i tlak
        # imaju iste takve vrijednosti: vlaga tocno 0.0 i 100.0 %, tlak oko
        # 496-519 hPa i 1240-1253 hPa (izmjereno 22.08. nakon prvog flasha).
        - lambda: |-
            if (x <= 0 || x >= 100) {
              ESP_LOGW("bme280_range", "Kupaona vlaga: odbaceno %.2f", x);
              return {};
            }
            return x;
    pressure:
      name: "Kupaona tlak"
      oversampling: 16x
      filters:
        # Odbaci reset-vrijednosti registara: kad citanje preko TCA9548A
        # kanala ne prodje, BME280 vrati svoje pocetne registre, sto se
        # kompenzira u dvije fiksne besmislice po senzoru (izmjereno
        # 2026-08-20: kupaona 188.5 / -57.6, soba 187.4 / -59.4). Vlaga i tlak
        # imaju iste takve vrijednosti: vlaga tocno 0.0 i 100.0 %, tlak oko
        # 496-519 hPa i 1240-1253 hPa (izmjereno 22.08. nakon prvog flasha).
        - lambda: |-
            if (x < 850 || x > 1085) {
              ESP_LOGW("bme280_range", "Kupaona tlak: odbaceno %.2f", x);
              return {};
            }
            return x;
    iir_filter: 4x

