# === Daljinski restart i dijagnostika (dodano 2026-08-26) ===
# Restart gumb da se plocica moze podici iz HA-a bez odlaska do nje.
# Uptime je kljucan za razlikovanje "plocica se resetirala" od "veza je pukla".
button:
  - platform: restart
    name: "Restart"
  - platform: safe_mode
    name: "Safe mode"

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

  - platform: internal_temperature
    name: "Temperatura cipa"
    entity_category: diagnostic

  - platform: debug
    free:
      name: "Slobodna memorija"
      entity_category: diagnostic
    loop_time:
      name: "Loop time"
      entity_category: diagnostic

# IP i razlog zadnjeg reseta: bez toga se "pala je veza" ne razlikuje
# od "plocica se resetirala", a to su dva razlicita kvara.
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP"
      entity_category: diagnostic
  - platform: debug
    reset_reason:
      name: "Razlog reseta"
      entity_category: diagnostic

debug:
  update_interval: 60s
