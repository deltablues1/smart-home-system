name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # sounddevice needs the PortAudio shared library at import time.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # No credentials and no network: every external call in the unit suite
      # is faked, so the suite runs identically here and on a laptop.
      - name: Unit tests
        env:
          DEPLOYMENT_PROFILE: dev
        run: pytest tests/unit -q -p no:cacheprovider -o addopts=""
